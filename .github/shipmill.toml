# shipmill reads this file on every run: https://github.com/shipmill/shipmill
name = "appstorespy-api-docs"

# Releases off: public API docs (README, Postman collection, examples) read from main;
# shipmill runs the agents only, with no release lane and no deploy
mode = "off"
branch = "main"

# pyproject: [project] version in pyproject.toml and uv.lock; none: tags and CHANGELOG only
version_files = "none"

[changelog]
path = "CHANGELOG.md"
style = "keep-a-changelog"
# Each pull request adds its entry as a file in this folder instead of editing the CHANGELOG;
# a stable release writes them into its section and deletes them
fragments = "changelog.d"

[bump]
from = "headings"
major = ["Breaking"]
minor = ["Added", "Changed", "Deprecated", "Removed"]
patch = ["Fixed", "Security"]

[gates]
# An open issue with this label holds the listed lanes
blocker_label = "release-blocker"
blocker_lanes = ["stable"]
# Inclusive UTC date ranges when the listed lanes hold, such as "2026-12-24..2027-01-02"
freeze = []
freeze_lanes = ["stable"]

[lanes.stable]                      # unused while mode is off
github_release = false

# The repo is public, so a merge reaches customers at once: the gate triages, fixes and
# reviews, labels a ready PR shipmill-ready, and Roman merges, as in as-rest and graph2
# (Roman, 2026-11-14, AppstorespyOS D-9). Every write posts as shipmill-romamo[bot]
[agents]
prompt = "/shipmill:github-issue-triage {repo} triage the new issues; do not merge. Review open PRs and label a green one that passes review `shipmill-ready`"
retry_hours = 24      # unchanged findings start a new session after this
notify = true         # a desktop notification when a session waits on you
remind_hours = 4      # repeat it while the session still waits
max_wait_minutes = 15 # stop a session that waited this long; 0: never
app_id = 5209412      # sessions write as shipmill-romamo[bot]
mode = "headless"     # nobody attaches: sessions ask on GitHub with needs-decision

# A component of the AppStoreSpy product (spec 038): its home repo coordinates work across repos
[product]
home = "romamo/AppstorespyOS"

[autonomy]
triage = "act"
fix = "act"
land = "propose"                  # reviews and labels shipmill-ready; Roman merges
upgrade = "act"                   # shipmill config migrations land without a question

name: Examples

# Runs the quickstart examples against the production API, so a contract change
# that breaks them shows up here. Each run spends real API calls: keep the
# triggers narrow.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_KEY: ${{ secrets.API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Fork pull requests get no secrets, and the secret may not be set yet:
      # skip the API calls with a notice instead of failing.
      - name: Check for the API key
        id: key
        run: |
          if [ -n "${API_KEY}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::API_KEY secret is not available; skipping the calls to the production API"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # --fail-with-body in quickstart.sh needs curl 7.76 or newer
      - name: quickstart.sh
        if: steps.key.outputs.present == 'true'
        run: bash examples/quickstart.sh

      - uses: astral-sh/setup-uv@v6
        if: steps.key.outputs.present == 'true'

      - name: quickstart.py
        if: steps.key.outputs.present == 'true'
        run: uv run --no-project --with httpx python examples/quickstart.py
